<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Reservas — Estilo Rent a Car</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  min-height:100vh;
  background:#F8F9FC;
  color:#1C1C1E;
  -webkit-tap-highlight-color:transparent;
  font-weight:300;
}

/* ── Background Liquid Glass ── */
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
#bg .blob1{position:absolute;width:65vw;height:65vw;top:-20%;left:-15%;border-radius:50%;background:radial-gradient(circle,rgba(130,170,240,.55) 0%,rgba(150,190,250,.22) 42%,transparent 68%);animation:b1 22s ease-in-out infinite alternate}
#bg .blob2{position:absolute;width:55vw;height:55vw;bottom:-18%;right:-12%;border-radius:50%;background:radial-gradient(circle,rgba(185,155,235,.50) 0%,rgba(200,170,245,.20) 44%,transparent 68%);animation:b2 28s ease-in-out infinite alternate}
#bg .blob3{position:absolute;width:42vw;height:42vw;top:30%;left:30%;border-radius:50%;background:radial-gradient(circle,rgba(140,210,195,.42) 0%,rgba(155,220,205,.16) 44%,transparent 68%);animation:b3 34s ease-in-out infinite alternate}
@keyframes b1{0%{transform:translate(0,0)}100%{transform:translate(5vw,7vh) scale(1.06)}}
@keyframes b2{0%{transform:translate(0,0)}100%{transform:translate(-6vw,-5vh) scale(1.08)}}
@keyframes b3{0%{transform:translate(0,0)}100%{transform:translate(4vw,-6vh) scale(1.04)}}

/* ── Glass card ── */
.glass{
  background:linear-gradient(160deg,rgba(255,255,255,.72) 0%,rgba(240,245,255,.54) 100%);
  backdrop-filter:blur(32px) saturate(2) brightness(1.04);
  -webkit-backdrop-filter:blur(32px) saturate(2) brightness(1.04);
  border:0.5px solid rgba(200,210,255,.30);
  box-shadow:0 4px 24px rgba(0,0,0,.07);
  border-radius:20px;
}
.glass-light{
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(20px) saturate(1.8);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);
  border:0.5px solid rgba(255,255,255,.70);
  box-shadow:0 2px 12px rgba(0,0,0,.05);
}

/* ── Pill button ── */
.pill{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 22px;border-radius:980px;border:none;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:400;letter-spacing:.01em;
  transition:transform .12s,opacity .12s;
}
.pill:active{transform:scale(.95);opacity:.85}
.pill-blue{background:rgba(0,122,255,.15);color:#007AFF}
.pill-dark{background:rgba(28,28,30,.88);color:#fff;backdrop-filter:blur(16px)}
.pill-ghost{background:rgba(120,120,128,.14);color:#3C3C43}
.pill-sm{padding:7px 16px;font-size:13px}
.pill-green{background:rgba(52,199,89,.16);color:#34C759}
.pill-red{background:rgba(255,59,48,.14);color:#FF3B30}

/* ── Layout ── */
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* ── Header ── */
header{
  padding:28px 0 22px;
  text-align:center;
}
.logo{font-size:22px;font-weight:800;letter-spacing:-.5px;color:#1C1C1E}
.logo span{color:#007AFF}
.tagline{font-size:13px;color:#8E8E93;margin-top:4px;font-weight:400}

/* ── Step nav ── */
.steps{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 24px}
.step{width:28px;height:28px;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .25s}
.step-done{background:#34C759;color:#fff}
.step-active{background:#007AFF;color:#fff}
.step-idle{background:rgba(120,120,128,.18);color:#8E8E93}
.step-line{height:1px;width:28px;background:rgba(120,120,128,.25)}

/* ── Section title ── */
.sec-title{font-size:11px;font-weight:700;color:#8E8E93;text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}

/* ── Vehicle cards ── */
.vei-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
@media(min-width:520px){.vei-grid{grid-template-columns:repeat(3,1fr)}}
.vei-card{
  padding:14px;cursor:pointer;transition:transform .15s;
  border-radius:18px;position:relative;overflow:hidden;
  border:2px solid transparent;
}
.vei-card:active{transform:scale(.97)}
.vei-card.selected{
  border-color:#007AFF;
  background:linear-gradient(160deg,rgba(0,122,255,.10) 0%,rgba(100,180,255,.06) 100%);
}
.vei-check{
  position:absolute;top:10px;right:10px;width:20px;height:20px;
  border-radius:50%;background:#007AFF;color:#fff;
  font-size:11px;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;
}
.vei-card.selected .vei-check{opacity:1}
.vei-icon{font-size:32px;text-align:center;margin-bottom:8px;line-height:1}
.vei-name{font-size:13px;font-weight:700;line-height:1.2}
.vei-placa{font-size:11px;color:#8E8E93;margin-top:2px}
.vei-price{font-size:13px;font-weight:700;color:#007AFF;margin-top:6px}

/* ── Form fields ── */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:#8E8E93;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{
  width:100%;padding:11px 14px;border-radius:13px;
  border:1px solid rgba(120,120,128,.22);
  font-family:inherit;font-size:14px;color:#1C1C1E;outline:none;
  background:rgba(255,255,255,.80);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  transition:border .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:#007AFF;
  background:rgba(255,255,255,.95);
}
.field textarea{resize:vertical;min-height:72px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── Summary card ── */
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(120,120,128,.12)}
.summary-row:last-child{border-bottom:none}
.summary-label{font-size:12px;color:#8E8E93}
.summary-val{font-size:13px;font-weight:600}

/* ── Success screen ── */
.success{text-align:center;padding:40px 20px}
.success-icon{font-size:56px;margin-bottom:16px;animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.success h2{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:8px}
.success p{font-size:14px;color:#8E8E93;max-width:320px;margin:0 auto 24px}

/* ── Empty state ── */
.empty{text-align:center;padding:36px 16px;color:#8E8E93;font-size:14px}

/* ── Loading ── */
.loading-row{display:flex;gap:10px}
.skel{border-radius:16px;background:linear-gradient(90deg,rgba(120,120,128,.10) 25%,rgba(120,120,128,.18) 50%,rgba(120,120,128,.10) 75%);background-size:200% 100%;animation:sk 1.4s ease-in-out infinite;height:110px;flex:1}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Toast ── */
#toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  padding:12px 24px;border-radius:16px;font-size:14px;font-weight:600;color:#fff;
  pointer-events:none;opacity:0;transition:all .3s;z-index:9999;
  backdrop-filter:blur(20px);max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:rgba(52,199,89,.90)}
#toast.err{background:rgba(255,59,48,.90)}

/* ── Nav bottom (embed-friendly) ── */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  background:rgba(255,255,255,.80);
  backdrop-filter:blur(24px) saturate(1.8);
  -webkit-backdrop-filter:blur(24px) saturate(1.8);
  border-top:0.5px solid rgba(0,0,0,.08);
  display:flex;gap:8px;z-index:100;
}
.bottom-bar .pill{flex:1}

/* ── Page visibility ── */
.page{display:none}
.page.active{display:block}
</style>
</head>
<body>

<div id="bg">
  <div class="blob1"></div>
  <div class="blob2"></div>
  <div class="blob3"></div>
</div>

<div id="toast"></div>

<div class="wrap">

  <!-- Header -->
  <header>
    <div class="logo">Estilo <span>Rent a Car</span></div>
    <div class="tagline">Reserva rápida e sem complicação</div>
  </header>

  <!-- Steps -->
  <div class="steps">
    <div class="step step-active" id="s1">1</div>
    <div class="step-line"></div>
    <div class="step step-idle" id="s2">2</div>
    <div class="step-line"></div>
    <div class="step step-idle" id="s3">3</div>
  </div>

  <!-- ── STEP 1: Datas + veículo ── -->
  <div class="page active" id="p1">

    <div class="glass" style="padding:18px;margin-bottom:16px">
      <div class="sec-title">Período da locação</div>
      <div class="row2">
        <div class="field">
          <label>Retirada</label>
          <input type="date" id="dt_inicio"/>
        </div>
        <div class="field">
          <label>Devolução</label>
          <input type="date" id="dt_fim"/>
        </div>
      </div>
    </div>

    <div class="glass" style="padding:18px;margin-bottom:80px">
      <div class="sec-title">Escolha o veículo</div>
      <div id="vei-container">
        <div class="loading-row">
          <div class="skel"></div><div class="skel"></div><div class="skel"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- ── STEP 2: Dados do cliente ── -->
  <div class="page" id="p2">
    <div class="glass" style="padding:18px;margin-bottom:80px">
      <div class="sec-title">Seus dados</div>

      <div class="field">
        <label>Nome completo</label>
        <input type="text" id="cl_nome" placeholder="Ex.: João da Silva" autocomplete="name"/>
      </div>
      <div class="row2">
        <div class="field">
          <label>WhatsApp</label>
          <input type="tel" id="cl_tel" placeholder="(11) 99999-9999" autocomplete="tel"/>
        </div>
        <div class="field">
          <label>CPF</label>
          <input type="text" id="cl_cpf" placeholder="000.000.000-00"/>
        </div>
      </div>
      <div class="field">
        <label>E-mail <span style="font-weight:300;text-transform:none">(opcional)</span></label>
        <input type="email" id="cl_email" placeholder="seu@email.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label>Observações <span style="font-weight:300;text-transform:none">(opcional)</span></label>
        <textarea id="cl_obs" placeholder="Algum pedido especial?"></textarea>
      </div>
    </div>
  </div>

  <!-- ── STEP 3: Confirmação ── -->
  <div class="page" id="p3">
    <div class="glass" style="padding:18px;margin-bottom:80px">
      <div class="sec-title">Resumo da reserva</div>
      <div id="summary"></div>
    </div>
  </div>

  <!-- ── STEP 4: Sucesso ── -->
  <div class="page" id="p4">
    <div class="success">
      <div class="success-icon">🎉</div>
      <h2>Reserva enviada!</h2>
      <p>Nossa equipe entrará em contato para confirmar. Obrigado!</p>
      <button class="pill pill-green" style="font-size:15px;padding:13px 28px" onclick="novaReserva()">Fazer nova reserva</button>
    </div>
  </div>

</div>

<!-- Bottom action bar -->
<div class="bottom-bar" id="bar">
  <button class="pill pill-ghost" id="btn-back" onclick="back()" style="display:none">← Voltar</button>
  <button class="pill pill-dark" id="btn-next" onclick="next()">Escolher veículo →</button>
</div>

<script>
const SB = "https://jsyiriqtzpbuqvjrkwin.supabase.co";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzeWlyaXF0enBidXF2anJrd2luIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMDEyNjksImV4cCI6MjA4ODU3NzI2OX0.BCeCKcwLGnrRhfaFryeTbbCRoGyt3wRPlZzfsxuV0mM";
const HDR = { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" };

var step = 1;
var veiculos = [];
var selectedVei = null;
var loading = false;

// ── Toast ──────────────────────────────────────────────
function toast(msg, type) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "show " + (type || "ok");
  setTimeout(function(){ el.className = ""; }, 3000);
}

// ── Data helpers ───────────────────────────────────────
function fmt(d) {
  if (!d) return "—";
  var p = d.split("-");
  return p[2] + "/" + p[1] + "/" + p[0];
}
function fmtBRL(v) {
  return "R$ " + parseFloat(v||0).toLocaleString("pt-BR", {minimumFractionDigits:2});
}
function dias() {
  var d1 = document.getElementById("dt_inicio").value;
  var d2 = document.getElementById("dt_fim").value;
  if (!d1 || !d2) return 0;
  return Math.max(1, Math.ceil((new Date(d2) - new Date(d1)) / 86400000));
}

// ── Load vehicles ──────────────────────────────────────
async function loadVeiculos() {
  try {
    var r = await fetch(SB + "/rest/v1/veiculos?order=marca.asc", { headers: HDR });
    veiculos = r.ok ? await r.json() : [];
  } catch(e) { veiculos = []; }
  renderVeiculos();
}

function veicOcupado(v, d1, d2) {
  // client-side check not possible without contracts — trust server
  return v.status === "manutencao" || v.status === "inativo";
}

function renderVeiculos() {
  var d1 = document.getElementById("dt_inicio").value;
  var d2 = document.getElementById("dt_fim").value;
  var container = document.getElementById("vei-container");

  var lista = veiculos.filter(function(v) {
    return v.status !== "manutencao" && v.status !== "inativo";
  });

  if (lista.length === 0) {
    container.innerHTML = '<div class="empty">Nenhum veículo disponível no momento.</div>';
    return;
  }

  container.innerHTML = '<div class="vei-grid" id="vei-grid"></div>';
  var grid = document.getElementById("vei-grid");
  lista.forEach(function(v) {
    var valorDia = v.valor_diaria ? parseFloat(v.valor_diaria) : 0;
    var nDias = dias();
    var est = valorDia > 0 && nDias > 0 ? fmtBRL(valorDia * nDias) : (valorDia > 0 ? fmtBRL(valorDia) + "/dia" : "—");

    var card = document.createElement("div");
    card.className = "glass-light vei-card" + (selectedVei && selectedVei.id == v.id ? " selected" : "");
    card.innerHTML = ""
      + '<div class="vei-check">✓</div>'
      + '<div class="vei-icon">🚗</div>'
      + '<div class="vei-name">' + (v.marca||"") + " " + (v.modelo||"") + '</div>'
      + '<div class="vei-placa">' + (v.placa||"—") + (v.ano ? " · " + v.ano : "") + '</div>'
      + '<div class="vei-price">' + est + '</div>';
    card.onclick = function() {
      selectedVei = v;
      document.querySelectorAll(".vei-card").forEach(function(c){ c.classList.remove("selected"); });
      card.classList.add("selected");
      updateNextBtn();
    };
    grid.appendChild(card);
  });
}

// ── Step navigation ────────────────────────────────────
function updateSteps() {
  for (var i = 1; i <= 3; i++) {
    var el = document.getElementById("s" + i);
    if (i < step) { el.className = "step step-done"; el.textContent = "✓"; }
    else if (i == step) { el.className = "step step-active"; el.textContent = i; }
    else { el.className = "step step-idle"; el.textContent = i; }
  }
}

function showPage(n) {
  document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
  document.getElementById("p" + n).classList.add("active");
  var bar = document.getElementById("bar");
  bar.style.display = n === 4 ? "none" : "";
}

function updateNextBtn() {
  var btn = document.getElementById("btn-next");
  var back = document.getElementById("btn-back");
  if (step === 1) {
    var d1 = document.getElementById("dt_inicio").value;
    var d2 = document.getElementById("dt_fim").value;
    var ok = d1 && d2 && d2 >= d1 && selectedVei;
    btn.textContent = ok ? "Preencher dados →" : "Escolher veículo →";
    btn.className = "pill " + (ok ? "pill-dark" : "pill-ghost");
    back.style.display = "none";
  } else if (step === 2) {
    btn.textContent = "Revisar reserva →";
    btn.className = "pill pill-dark";
    back.style.display = "";
  } else if (step === 3) {
    btn.textContent = loading ? "Enviando..." : "Confirmar reserva ✓";
    btn.className = "pill pill-dark";
    back.style.display = "";
  }
}

function next() {
  if (loading) return;
  if (step === 1) {
    var d1 = document.getElementById("dt_inicio").value;
    var d2 = document.getElementById("dt_fim").value;
    if (!d1 || !d2) return toast("Preencha as datas de retirada e devolução", "err");
    if (d2 < d1) return toast("Data de devolução deve ser após a retirada", "err");
    if (!selectedVei) return toast("Selecione um veículo", "err");
    step = 2; updateSteps(); showPage(2); updateNextBtn();
    window.scrollTo(0, 0);
  } else if (step === 2) {
    var nome = document.getElementById("cl_nome").value.trim();
    var tel = document.getElementById("cl_tel").value.trim();
    if (!nome) return toast("Informe seu nome", "err");
    if (!tel) return toast("Informe seu WhatsApp", "err");
    buildSummary();
    step = 3; updateSteps(); showPage(3); updateNextBtn();
    window.scrollTo(0, 0);
  } else if (step === 3) {
    submitReserva();
  }
}

function back() {
  if (step <= 1) return;
  step--;
  updateSteps();
  showPage(step);
  updateNextBtn();
  window.scrollTo(0, 0);
}

// ── Summary ────────────────────────────────────────────
function buildSummary() {
  var d1 = document.getElementById("dt_inicio").value;
  var d2 = document.getElementById("dt_fim").value;
  var n = dias();
  var valorDia = selectedVei && selectedVei.valor_diaria ? parseFloat(selectedVei.valor_diaria) : 0;
  var est = valorDia > 0 ? fmtBRL(valorDia * n) : "A consultar";

  var rows = [
    { l: "Veículo", v: (selectedVei.marca||"") + " " + (selectedVei.modelo||"") + " · " + (selectedVei.placa||"") },
    { l: "Retirada", v: fmt(d1) },
    { l: "Devolução", v: fmt(d2) },
    { l: "Período", v: n + " dia" + (n > 1 ? "s" : "") },
    { l: "Valor estimado", v: est },
    { l: "Nome", v: document.getElementById("cl_nome").value },
    { l: "WhatsApp", v: document.getElementById("cl_tel").value },
    { l: "CPF", v: document.getElementById("cl_cpf").value || "—" },
  ];
  var obs = document.getElementById("cl_obs").value.trim();
  if (obs) rows.push({ l: "Observações", v: obs });

  var html = rows.map(function(r){
    return '<div class="summary-row"><span class="summary-label">' + r.l + '</span><span class="summary-val">' + r.v + '</span></div>';
  }).join("");
  document.getElementById("summary").innerHTML = html;
}

// ── Submit ─────────────────────────────────────────────
async function submitReserva() {
  if (loading) return;
  loading = true;
  updateNextBtn();

  var d1 = document.getElementById("dt_inicio").value;
  var d2 = document.getElementById("dt_fim").value;
  var nome = document.getElementById("cl_nome").value.trim();
  var tel = document.getElementById("cl_tel").value.trim();
  var cpf = document.getElementById("cl_cpf").value.trim();
  var email = document.getElementById("cl_email").value.trim();
  var obs = document.getElementById("cl_obs").value.trim();
  var valorDia = selectedVei && selectedVei.valor_diaria ? parseFloat(selectedVei.valor_diaria) : 0;
  var n = dias();
  var est = valorDia > 0 ? (valorDia * n).toFixed(2) : null;

  // Tenta encontrar cliente existente por CPF ou telefone
  var clienteId = null;
  try {
    var busca = await fetch(SB + "/rest/v1/clientes?cpf=eq." + encodeURIComponent(cpf) + "&limit=1", { headers: HDR });
    var cl = busca.ok ? await busca.json() : [];
    if (cl.length === 0 && tel) {
      busca = await fetch(SB + "/rest/v1/clientes?telefone=eq." + encodeURIComponent(tel) + "&limit=1", { headers: HDR });
      cl = busca.ok ? await busca.json() : [];
    }
    if (cl.length > 0) {
      clienteId = cl[0].id;
    } else {
      // Cria cliente novo
      var novoCliente = { nome: nome, telefone: tel, cpf: cpf || null, email: email || null };
      var rc = await fetch(SB + "/rest/v1/clientes", {
        method: "POST",
        headers: Object.assign({}, HDR, { Prefer: "return=representation" }),
        body: JSON.stringify(novoCliente)
      });
      if (rc.ok) {
        var created = await rc.json();
        clienteId = created[0] ? created[0].id : null;
      }
    }
  } catch(e) {}

  // Cria reserva
  try {
    var payload = {
      veiculo_id: selectedVei.id,
      cliente_id: clienteId,
      data_inicio: d1,
      data_fim: d2,
      valor_estimado: est ? parseFloat(est) : null,
      telefone_contato: tel,
      observacoes: [nome, obs].filter(Boolean).join(" | ") + (email ? " | " + email : ""),
      status: "pendente"
    };
    var rr = await fetch(SB + "/rest/v1/reservas", {
      method: "POST",
      headers: Object.assign({}, HDR, { Prefer: "return=representation" }),
      body: JSON.stringify(payload)
    });
    if (!rr.ok) throw new Error(await rr.text());
    step = 4; updateSteps(); showPage(4);
    // WhatsApp confirmation (optional)
    var wppTxt = "Olá! Solicitei uma reserva na Estilo Rent a Car 🚗\n\n"
      + "Veículo: " + (selectedVei.marca||"") + " " + (selectedVei.modelo||"") + "\n"
      + "Retirada: " + fmt(d1) + "\n"
      + "Devolução: " + fmt(d2) + "\n"
      + (est ? "Valor estimado: " + fmtBRL(parseFloat(est)) + "\n" : "")
      + "\nAguardo a confirmação! 😊";
    // Try to open WhatsApp to the company (optional — empresa number not available here)
  } catch(e) {
    toast("Erro ao enviar: " + (e.message || "tente novamente"), "err");
  }
  loading = false;
  updateNextBtn();
}

// ── Reset ──────────────────────────────────────────────
function novaReserva() {
  step = 1;
  selectedVei = null;
  document.getElementById("dt_inicio").value = "";
  document.getElementById("dt_fim").value = "";
  document.getElementById("cl_nome").value = "";
  document.getElementById("cl_tel").value = "";
  document.getElementById("cl_cpf").value = "";
  document.getElementById("cl_email").value = "";
  document.getElementById("cl_obs").value = "";
  updateSteps();
  showPage(1);
  renderVeiculos();
  updateNextBtn();
  document.getElementById("bar").style.display = "";
  window.scrollTo(0, 0);
}

// ── Date min ───────────────────────────────────────────
var hoje = new Date().toISOString().split("T")[0];
document.getElementById("dt_inicio").min = hoje;
document.getElementById("dt_fim").min = hoje;
document.getElementById("dt_inicio").addEventListener("change", function() {
  var d1 = this.value;
  document.getElementById("dt_fim").min = d1;
  if (document.getElementById("dt_fim").value && document.getElementById("dt_fim").value < d1) {
    document.getElementById("dt_fim").value = "";
  }
  renderVeiculos();
  updateNextBtn();
});
document.getElementById("dt_fim").addEventListener("change", function() {
  renderVeiculos();
  updateNextBtn();
});

// ── Init ───────────────────────────────────────────────
loadVeiculos();
updateNextBtn();
</script>
</body>
