name: Deploy Supabase Edge Functions

# Dispara pelo botão "Run workflow" na aba Actions (funciona pelo navegador
# do celular, e pelo app do GitHub também mostra o histórico/status) ou
# automaticamente quando algo em supabase/functions muda na main.
#
# Precisa do secret SUPABASE_ACCESS_TOKEN (Settings > Secrets and variables
# > Actions > New repository secret) — um token PESSOAL da sua conta
# Supabase, gerado em supabase.com/dashboard/account/tokens (Account >
# Access Tokens). É diferente da anon key e da service_role key que já
# existem no app: aquelas autenticam o app com o banco, esta autentica o
# CLI com a sua conta Supabase pra poder fazer deploy.

on:
  workflow_dispatch:
    inputs:
      function:
        description: 'Nome da function pra fazer deploy (vazio = todas)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy das functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN não configurado. Gere em supabase.com/dashboard/account/tokens (Account > Access Tokens) e cole em Settings > Secrets and variables > Actions deste repositório."
            exit 1
          fi

          PROJECT_REF="jsyiriqtzpbuqvjrkwin"
          FN="${{ github.event.inputs.function }}"

          if [ -n "$FN" ]; then
            echo "→ deploy $FN"
            supabase functions deploy "$FN" --project-ref "$PROJECT_REF"
          else
            for d in supabase/functions/*/; do
              name=$(basename "$d")
              echo "→ deploy $name"
              supabase functions deploy "$name" --project-ref "$PROJECT_REF"
            done
          fi
