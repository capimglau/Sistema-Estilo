<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner Frota – Estilo Rent a Car</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Demo body — remove/customize ao embedar */
body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0e0e14;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: center;
}

/* ─────────────── BANNER WRAPPER ─────────────── */
.bv-wrap {
  width: 100%;
  position: relative;
  overflow: hidden;
  background: #0D1B4B; /* fallback enquanto carrega */
  -webkit-user-select: none;
  user-select: none;
}

/* ─────────────── SLIDES TRACK ─────────────── */
.bv-track {
  display: flex;
  transition: transform 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  will-change: transform;
}

/* ─────────────── SLIDE ─────────────── */
.bv-slide {
  min-width: 100%;
  width: 100%;
  flex-shrink: 0;
  height: 192px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  padding: 0 60px 24px 36px;
}

/* Background gradient */
.bv-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}

/* Decorative light blobs */
.bv-deco {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

/* Letra decorativa gigante no fundo */
.bv-letter {
  position: absolute;
  right: -8px;
  top: 50%;
  transform: translateY(-52%);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 280px;
  line-height: 1;
  color: rgba(255,255,255,0.028);
  pointer-events: none;
  z-index: 1;
  letter-spacing: -4px;
}

/* Círculos decorativos */
.bv-circle1 {
  position: absolute;
  right: -30px;
  top: -50px;
  width: 210px;
  height: 210px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 1;
  opacity: 0.08;
}
.bv-circle2 {
  position: absolute;
  right: 80px;
  bottom: -55px;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 1;
  opacity: 0.05;
}

/* ─────────────── CORPO DO SLIDE ─────────────── */
.bv-body {
  position: relative;
  z-index: 2;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 0;
}

/* LEFT — marca + status */
.bv-left {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 128px;
  padding-right: 22px;
  margin-right: 22px;
  border-right: 1px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
}

.bv-company {
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  line-height: 1;
}

.bv-brand {
  font-size: 19px;
  font-weight: 800;
  color: #fff;
  line-height: 1.15;
  letter-spacing: -0.3px;
}

.bv-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px 3px 7px;
  border-radius: 100px;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  width: fit-content;
  margin-top: 6px;
}
.bv-status .bv-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}
.bv-st-disp { background: rgba(52,199,89,0.16);   color: #4CD964; border: 1px solid rgba(52,199,89,0.22); }
.bv-st-alug { background: rgba(255,159,10,0.16);  color: #FF9F0A; border: 1px solid rgba(255,159,10,0.22); }
.bv-st-man  { background: rgba(255,69,58,0.14);   color: #FF453A; border: 1px solid rgba(255,69,58,0.18); }
.bv-st-encomenda { background: rgba(191,90,242,0.16); color: #D97FFF; border: 1px solid rgba(191,90,242,0.24); }

/* CENTER — modelo + specs */
.bv-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.bv-cat {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  line-height: 1;
}

.bv-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 50px;
  line-height: 0.87;
  color: #fff;
  letter-spacing: 0.3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bv-specs {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 5px;
}

.bv-spec {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 100px;
  padding: 3px 9px;
  font-size: 10px;
  color: rgba(255,255,255,0.72);
  font-weight: 500;
  white-space: nowrap;
  line-height: 1.2;
}

/* RIGHT — preço + CTA */
.bv-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 7px;
  padding-left: 22px;
  flex-shrink: 0;
}

.bv-price-lbl {
  font-size: 8px;
  font-weight: 600;
  color: rgba(255,255,255,0.32);
  text-transform: uppercase;
  letter-spacing: 1px;
  text-align: right;
}

.bv-price {
  display: flex;
  align-items: flex-start;
  gap: 1px;
  line-height: 1;
}

.bv-price-curr {
  font-size: 14px;
  font-weight: 800;
  margin-top: 7px;
  line-height: 1;
}

.bv-price-int {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 50px;
  line-height: 0.87;
  color: #fff;
}

.bv-price-dec {
  font-size: 17px;
  font-weight: 700;
  margin-top: 4px;
  line-height: 1;
}

.bv-price-per {
  font-size: 8px;
  color: rgba(255,255,255,0.3);
  text-align: right;
  margin-top: 1px;
}

.bv-cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 10px 18px;
  border-radius: 11px;
  font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  font-size: 12px;
  font-weight: 800;
  text-decoration: none;
  cursor: pointer;
  border: none;
  color: #1B2B6B;
  letter-spacing: 0.2px;
  transition: transform 0.12s ease, filter 0.12s ease;
  box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  white-space: nowrap;
  line-height: 1;
}
.bv-cta:active { transform: scale(0.94); filter: brightness(0.88); }
.bv-cta:hover  { filter: brightness(1.06); }

/* ─────────────── SETAS ─────────────── */
.bv-arr {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 30;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(0,0,0,0.32);
  border: 1px solid rgba(255,255,255,0.14);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, transform 0.1s;
  padding: 0;
  line-height: 1;
  margin-bottom: 10px; /* alinhar com padding-bottom do slide */
}
.bv-arr:hover  { background: rgba(0,0,0,0.55); }
.bv-arr:active { transform: translateY(-50%) scale(0.86); }
.bv-arr-prev { left: 10px; }
.bv-arr-next { right: 10px; }

/* ─────────────── INDICADORES ─────────────── */
.bv-indicators {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  display: flex;
  gap: 5px;
  align-items: center;
}

.bv-dot-ind {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  transition: all 0.32s ease;
  cursor: pointer;
  flex-shrink: 0;
}
.bv-dot-ind.active {
  width: 20px;
  border-radius: 3px;
}

/* ─────────────── BARRA DE PROGRESSO ─────────────── */
.bv-progress {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 3px;
  width: 0%;
  z-index: 30;
  border-radius: 0 3px 3px 0;
  transition: width 0.1s linear;
  opacity: 0.75;
}

/* ─────────────── CONTADOR ─────────────── */
.bv-counter {
  position: absolute;
  top: 10px;
  right: 52px;
  z-index: 30;
  font-size: 10px;
  font-weight: 600;
  color: rgba(255,255,255,0.28);
  letter-spacing: 1px;
  margin-bottom: 10px;
}

/* ─────────────── LOADING ─────────────── */
.bv-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  height: 192px;
  background: linear-gradient(135deg, #0D1B4B 0%, #1B2B6B 100%);
}
.bv-loading span {
  font-size: 13px;
  color: rgba(255,255,255,0.38);
  font-family: 'Plus Jakarta Sans', sans-serif;
}
@keyframes bv-spin { to { transform: rotate(360deg); } }
.bv-loader {
  width: 22px;
  height: 22px;
  border: 2px solid rgba(255,255,255,0.1);
  border-top-color: #E8A020;
  border-radius: 50%;
  animation: bv-spin 0.8s linear infinite;
  flex-shrink: 0;
}

/* ─────────────── RESPONSIVE MOBILE ─────────────── */
@media (max-width: 640px) {
  .bv-slide {
    height: auto;
    min-height: 210px;
    padding: 14px 14px 42px;
    align-items: flex-start;
  }

  .bv-body {
    flex-direction: column;
    gap: 10px;
  }

  /* Left: horizontal, separado por borda inferior */
  .bv-left {
    flex-direction: row;
    align-items: center;
    gap: 10px;
    border-right: none;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding-right: 0;
    margin-right: 0;
    padding-bottom: 10px;
    min-width: unset;
    width: 100%;
    justify-content: space-between;
  }
  .bv-company { display: none; }
  .bv-brand   { font-size: 15px; }
  .bv-status  { margin-top: 0; }

  /* Center */
  .bv-center { width: 100%; }
  .bv-name   { font-size: 36px; }
  .bv-cat    { font-size: 8px; }
  .bv-spec   { font-size: 9px; padding: 2px 8px; }

  /* Right: horizontal */
  .bv-right {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding-left: 0;
    padding-top: 2px;
    gap: 10px;
  }
  .bv-price-lbl { display: none; }
  .bv-price-per { display: none; }
  .bv-price-int { font-size: 36px; }
  .bv-price-curr{ font-size: 11px; margin-top: 6px; }
  .bv-price-dec { font-size: 13px; margin-top: 4px; }
  .bv-cta { padding: 9px 14px; font-size: 11px; }

  /* Setas: esconde no mobile (swipe disponível) */
  .bv-arr { display: none; }
  .bv-counter { right: 14px; top: 8px; font-size: 9px; }

  .bv-loading { height: 160px; }
  .bv-letter  { font-size: 200px; right: -10px; }
}

@media (max-width: 380px) {
  .bv-name      { font-size: 30px; }
  .bv-price-int { font-size: 30px; }
}
</style>
</head>
<body>

<div class="bv-wrap" id="bvWrap">
  <div class="bv-loading">
    <div class="bv-loader"></div>
    <span>Carregando frota...</span>
  </div>
</div>

<script>
'use strict';

/* ── CONFIGURAÇÃO SUPABASE ── */
const SB_URL = 'https://jsyiriqtzpbuqvjrkwin.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzeWlyaXF0enBidXF2anJrd2luIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMDEyNjksImV4cCI6MjA4ODU3NzI2OX0.BCeCKcwLGnrRhfaFryeTbbCRoGyt3wRPlZzfsxuV0mM';
const HDR = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

/* ══════════════════════════════════════════════════════════════════
   VEÍCULOS SOB DEMANDA — edite esta lista para adicionar/remover
   Estes veículos são exibidos no banner mesmo sem estar na frota.

   Campos obrigatórios : marca, modelo
   Campos opcionais    : ano, cor, valor_diaria (0 = "Consulte"),
                         descricao (texto livre exibido como spec)
   ══════════════════════════════════════════════════════════════════ */
const SOB_DEMANDA = [
  {
    marca: 'Toyota',
    modelo: 'Hilux',
    ano: '2024',
    cor: 'Branco',
    valor_diaria: 350,
    descricao: 'Cabine dupla · 4x4 · Diesel',
  },
  {
    marca: 'Jeep',
    modelo: 'Wrangler',
    ano: '2024',
    cor: 'Verde',
    valor_diaria: 480,
    descricao: 'Rubicon · 4x4 · Automático',
  },
  /* Adicione mais veículos aqui seguindo o mesmo padrão */
];

/* ── DURAÇÃO DE CADA SLIDE (ms) ── */
const DURATION = 5500;

/* ── TEMAS DE COR POR SLIDE ── */
const THEMES = [
  { from: '#0D1B4B', to: '#1B2B6B', accent: '#E8A020' },   // azul marino / ouro
  { from: '#0A1628', to: '#0F2A4A', accent: '#4A9EFF' },   // azul escuro / céu
  { from: '#0A1A10', to: '#112A18', accent: '#34C759' },   // verde escuro / verde
  { from: '#1A0A0A', to: '#3A1010', accent: '#FF6961' },   // vermelho escuro
  { from: '#180A22', to: '#2E1040', accent: '#BF5AF2' },   // roxo escuro
  { from: '#0A1A1A', to: '#0F2E2E', accent: '#5AC8FA' },   // teal escuro / azul claro
  { from: '#1A1208', to: '#3A2810', accent: '#FF9F0A' },   // marrom / laranja
  { from: '#0D0D1A', to: '#181830', accent: '#64D2FF' },   // índigo escuro
];

/* ── UTILITÁRIOS ── */
function fmtNum(n) {
  return Number(n || 0).toLocaleString('pt-BR');
}

function categoryOf(marca, modelo) {
  const s = ((marca || '') + ' ' + (modelo || '')).toLowerCase();
  if (/t-cross|tcross|kicks|creta|compass|tracker|duster|tiguan|taos|hr-v|hrv|ix35|tucson|2008\b|3008\b/.test(s)) return 'SUV';
  if (/corolla|civic|sentra|cruze|fusion|accord|camry|jetta|cerato/.test(s)) return 'Sedan';
  if (/onix|hb20|polo|fit|gol|\bup!\b|march|sandero|kwid|argo|mobi|pulse\b/.test(s)) return 'Hatch';
  if (/s10|hilux|ranger|frontier|l200|toro|saveiro|amarok/.test(s)) return 'Pickup';
  if (/spin|zafira|lodgy|livina|sharan/.test(s)) return 'Minivan';
  if (/camaro|mustang|\btt\b|\ba3\b|\ba4\b|coupe/.test(s)) return 'Esportivo';
  return 'Automóvel';
}

function statusInfo(s, isSobDemanda) {
  if (isSobDemanda) return { cls: 'bv-st-encomenda', lbl: 'Sob Demanda' };
  return {
    disponivel: { cls: 'bv-st-disp', lbl: 'Disponível' },
    alugado:    { cls: 'bv-st-alug', lbl: 'Alugado'    },
    manutencao: { cls: 'bv-st-man',  lbl: 'Manutenção' },
  }[s] || { cls: 'bv-st-disp', lbl: s || 'Disponível' };
}

/* ── CRIA HTML DE UM SLIDE ── */
function mkSlide(v, idx, empresa) {
  const th           = THEMES[idx % THEMES.length];
  const isSobDemanda = v._tipo === 'sob_demanda';
  const cat          = categoryOf(v.marca, v.modelo);
  const si           = statusInfo(v.status, isSobDemanda);
  const price        = parseFloat(v.valor_diaria || 0);
  const pInt         = Math.floor(price);
  const pDec         = ',' + String(Math.round((price - pInt) * 100)).padStart(2, '0');
  const semPreco     = price === 0;

  /* Monta link WhatsApp */
  const rawPhone = ((empresa && empresa.telefone) || '').replace(/\D/g, '');
  const wppPhone = rawPhone.length >= 10
    ? (rawPhone.startsWith('55') ? rawPhone : '55' + rawPhone)
    : '5511989990949';
  const wppAction = isSobDemanda ? 'encomendar' : 'alugar';
  const wppText   = encodeURIComponent(
    'Olá! Gostaria de ' + wppAction + ' o ' + (v.marca || '') + ' ' + (v.modelo || '') + '. Poderia me passar mais informações?'
  );

  /* Specs */
  const specs = [];
  if (v.ano)       specs.push({ icon: '📅', val: v.ano });
  if (v.cor)       specs.push({ icon: '🎨', val: v.cor });
  if (v.km)        specs.push({ icon: '📍', val: fmtNum(v.km) + ' km' });
  if (v.descricao) specs.push({ icon: '✦',  val: v.descricao });

  const nomeEmpresa = (empresa && empresa.nome) || 'Estilo Rent a Car';
  const bgLetter    = (v.marca || '').charAt(0).toUpperCase();
  const modeloUp    = (v.modelo || '–').toUpperCase();
  const ctaLabel    = isSobDemanda ? 'Encomendar →' : 'Reservar →';
  const priceLbl    = isSobDemanda ? 'A partir de' : 'Valor por dia';
  const pricePer    = isSobDemanda ? '/dia · sob encomenda' : '/dia · sem fidelidade';

  /* Bloco de preço: se sem preço, mostra "Consulte" */
  const priceBlock = semPreco
    ? `<div class="bv-price" style="align-items:center">
         <span class="bv-price-curr" style="color:${th.accent};font-size:22px;margin-top:0">Consulte</span>
       </div>`
    : `<div class="bv-price">
         <span class="bv-price-curr" style="color:${th.accent}">R$</span>
         <span class="bv-price-int">${pInt}</span>
         <span class="bv-price-dec" style="color:${th.accent}">${pDec}</span>
       </div>`;

  return `<div class="bv-slide">
  <div class="bv-bg" style="background:linear-gradient(135deg,${th.from} 0%,${th.to} 100%)"></div>
  <div class="bv-deco" style="background:
    radial-gradient(ellipse 55% 80% at 68% 50%,rgba(255,255,255,0.035) 0%,transparent 68%),
    radial-gradient(ellipse 28% 70% at 94% 6%,${th.accent}1E 0%,transparent 60%)
  "></div>
  <div class="bv-letter">${bgLetter}</div>
  <div class="bv-circle1" style="background:${th.accent}"></div>
  <div class="bv-circle2" style="background:${th.accent}"></div>

  <div class="bv-body">

    <!-- ESQUERDA: marca + status -->
    <div class="bv-left">
      <div>
        <div class="bv-company">${nomeEmpresa}</div>
        <div class="bv-brand">${v.marca || '–'}</div>
      </div>
      <div class="bv-status ${si.cls}">
        <span class="bv-dot"></span>${si.lbl}
      </div>
    </div>

    <!-- CENTRO: modelo + especificações -->
    <div class="bv-center">
      <div class="bv-cat" style="color:${th.accent}">${cat}</div>
      <div class="bv-name">${modeloUp}</div>
      <div class="bv-specs">
        ${specs.map(s => `<span class="bv-spec">${s.icon} ${s.val}</span>`).join('')}
        ${v.placa ? `<span class="bv-spec" style="color:${th.accent}BB;border-color:${th.accent}22">🔖 ${v.placa}</span>` : ''}
      </div>
    </div>

    <!-- DIREITA: preço + CTA -->
    <div class="bv-right">
      <div class="bv-price-lbl">${priceLbl}</div>
      <div>
        ${priceBlock}
        <div class="bv-price-per">${pricePer}</div>
      </div>
      <a class="bv-cta"
         href="https://wa.me/${wppPhone}?text=${wppText}"
         target="_blank" rel="noopener noreferrer"
         style="background:${th.accent}">
        ${ctaLabel}
      </a>
    </div>

  </div>
</div>`;
}

/* ── LÓGICA DO CARROSSEL ── */
let cur = 0, total = 0;
let autoTimer = null, progTimer = null, progStart = 0;
let isPaused = false;
let wrap, track, dotsWrap, progressBar, counterEl;

function goTo(idx) {
  cur = ((idx % total) + total) % total;
  track.style.transform = 'translateX(-' + (cur * 100) + '%)';

  /* Atualiza dots */
  const dots = dotsWrap.querySelectorAll('.bv-dot-ind');
  const th   = THEMES[cur % THEMES.length];
  dots.forEach(function(d, i) {
    d.classList.toggle('active', i === cur);
    d.style.background = i === cur ? th.accent : 'rgba(255,255,255,0.25)';
  });

  /* Contador */
  counterEl.textContent = (cur + 1) + ' / ' + total;

  /* Barra de progresso */
  clearInterval(progTimer);
  progressBar.style.width = '0%';
  progressBar.style.background = th.accent;
  if (!isPaused) startProgress();
}

function startProgress() {
  progStart = Date.now();
  progTimer = setInterval(function() {
    var p = Math.min(100, (Date.now() - progStart) / DURATION * 100);
    progressBar.style.width = p + '%';
    if (p >= 100) clearInterval(progTimer);
  }, 50);
}

function startAuto() {
  clearInterval(autoTimer);
  autoTimer = setInterval(function() { goTo(cur + 1); }, DURATION);
  if (!isPaused) startProgress();
}

function stopAll() {
  clearInterval(autoTimer);
  clearInterval(progTimer);
}

function pause() {
  isPaused = true;
  stopAll();
  progressBar.style.width = '0%';
}

function resume() {
  isPaused = false;
  startAuto();
}

/* ── MONTA O BANNER COM OS VEÍCULOS ── */
function buildBanner(vehicles, empresa) {
  total = vehicles.length;
  if (total === 0) {
    wrap.innerHTML = '<div class="bv-loading"><span style="color:rgba(255,255,255,0.3)">Nenhum veículo disponível.</span></div>';
    return;
  }

  /* Slides */
  var trackEl = document.createElement('div');
  trackEl.className = 'bv-track';
  trackEl.id = 'bvTrack';
  trackEl.innerHTML = vehicles.map(function(v, i) { return mkSlide(v, i, empresa); }).join('');
  wrap.appendChild(trackEl);
  track = trackEl;

  /* Setas (desktop) */
  if (total > 1) {
    var prev = document.createElement('button');
    prev.className = 'bv-arr bv-arr-prev';
    prev.setAttribute('aria-label', 'Slide anterior');
    prev.textContent = '‹';
    prev.onclick = function() { goTo(cur - 1); startAuto(); };

    var next = document.createElement('button');
    next.className = 'bv-arr bv-arr-next';
    next.setAttribute('aria-label', 'Próximo slide');
    next.textContent = '›';
    next.onclick = function() { goTo(cur + 1); startAuto(); };

    wrap.appendChild(prev);
    wrap.appendChild(next);
  }

  /* Indicadores de ponto */
  var inds = document.createElement('div');
  inds.className = 'bv-indicators';
  vehicles.forEach(function(_, i) {
    var d = document.createElement('div');
    d.className = 'bv-dot-ind';
    d.setAttribute('role', 'button');
    d.setAttribute('tabindex', '0');
    d.setAttribute('aria-label', 'Ir para slide ' + (i + 1));
    d.onclick = function() { goTo(i); startAuto(); };
    inds.appendChild(d);
  });
  wrap.appendChild(inds);
  dotsWrap = inds;

  /* Barra de progresso */
  var pb = document.createElement('div');
  pb.className = 'bv-progress';
  wrap.appendChild(pb);
  progressBar = pb;

  /* Contador */
  var cnt = document.createElement('div');
  cnt.className = 'bv-counter';
  wrap.appendChild(cnt);
  counterEl = cnt;

  /* Inicializa */
  goTo(0);
  startAuto();

  /* Pausa ao passar o mouse (desktop) */
  wrap.addEventListener('mouseenter', pause);
  wrap.addEventListener('mouseleave', resume);

  /* Swipe touch (mobile) */
  var touchX = null, touchY = null, moved = false;
  wrap.addEventListener('touchstart', function(e) {
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
    moved  = false;
    pause();
  }, { passive: true });

  wrap.addEventListener('touchmove', function(e) {
    if (touchX === null) return;
    var dx = Math.abs(e.touches[0].clientX - touchX);
    var dy = Math.abs(e.touches[0].clientY - touchY);
    if (dx > dy && dx > 8) {
      moved = true;
      e.preventDefault(); /* previne scroll horizontal */
    }
  }, { passive: false });

  wrap.addEventListener('touchend', function(e) {
    if (touchX !== null && moved) {
      var dx = touchX - e.changedTouches[0].clientX;
      if (Math.abs(dx) > 38) goTo(dx > 0 ? cur + 1 : cur - 1);
    }
    touchX = touchY = null;
    moved  = false;
    resume();
  }, { passive: true });

  /* Teclado */
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft')  { goTo(cur - 1); startAuto(); }
    if (e.key === 'ArrowRight') { goTo(cur + 1); startAuto(); }
  });
}

/* ── DADOS DE FALLBACK (caso Supabase offline) ── */
var FALLBACK_FROTA = [
  { marca:'Volkswagen', modelo:'T-Cross', ano:'2023', cor:'Branco',   km:14800, valor_diaria:180, status:'disponivel', placa:'BRA-2E24' },
  { marca:'Toyota',     modelo:'Corolla', ano:'2022', cor:'Prata',    km:27600, valor_diaria:160, status:'disponivel', placa:'SBC-4F56' },
  { marca:'Hyundai',    modelo:'HB20',    ano:'2023', cor:'Vermelho', km:8300,  valor_diaria:95,  status:'disponivel', placa:'MON-7G89' },
];

/* Marca os veículos sob demanda com _tipo para o mkSlide distinguir */
function marcaSobDemanda(list) {
  return list.map(function(v) { return Object.assign({}, v, { _tipo: 'sob_demanda' }); });
}

/* ── INICIALIZAÇÃO ── */
async function init() {
  wrap = document.getElementById('bvWrap');

  var frota   = [];
  var empresa = {};

  try {
    var [vRes, cRes] = await Promise.all([
      fetch(SB_URL + '/rest/v1/veiculos?status=neq.inativo&order=id.asc', { headers: HDR }),
      fetch(SB_URL + '/rest/v1/config?limit=1', { headers: HDR })
    ]);

    frota   = (vRes && vRes.ok) ? await vRes.json() : [];
    var cfg = (cRes  && cRes.ok) ? await cRes.json() : [];
    empresa = (cfg && cfg[0]) || {};
  } catch (err) {
    console.warn('[banner-veiculos] Supabase offline, usando fallback:', err);
    frota = FALLBACK_FROTA;
  }

  /* Une frota real + sob demanda (sob demanda sempre no final) */
  var todos = (frota.length > 0 ? frota : FALLBACK_FROTA).concat(marcaSobDemanda(SOB_DEMANDA));

  wrap.innerHTML = '';
  buildBanner(todos, empresa);
}

init();
</script>
