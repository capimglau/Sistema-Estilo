name: Deploy para GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # O sw.js precisa do mesmo carimbo: o nome do cache deriva dele, e é a
      # troca desse nome que faz o service worker descartar a versão anterior.
      # Sem isto o cache chamaria sempre "autogest-__BUILD_SHA__" e o app velho
      # ficaria grudado no dispositivo.
      - name: Carimbar o build
        run: |
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA::7}/" index.html
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA::7}/" sw.js

      - name: Publicar na gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          # Nada de fonte, rascunho ou backup vai pro ar. index.txt / index_backup.html /
          # Lixo.html / infex.html são cópias do app inteiro; backups/ e supabase/ são
          # material interno. Publicar isso expõe a lógica de negócio e as Edge Functions.
          exclude_assets: '.github,.claude,supabase,backups,index.txt,index_backup.html,Lixo.html,infex.html,CLAUDE.md,README.md'
