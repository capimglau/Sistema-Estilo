name: Testes

# Roda a suíte em todo push e em todo PR. Sem isto, uma regressão nas regras
# de validação ou de conflito de agenda só apareceria em produção — o app não
# tinha nenhum teste automatizado até aqui.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A suíte não tem dependências de propósito: nada de instalar pacote
      # para rodar teste num projeto que também não tem bundler.
      - name: Rodar testes
        run: node tests/run.js
