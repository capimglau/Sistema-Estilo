<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner Frota – Estilo Rent a Car</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: transparent;
  margin: 0; padding: 0;
}

/* ─── WRAPPER ─── */
.bv-wrap {
  width: 100%;
  position: relative;
  overflow: hidden;
  background: #0D1B4B;
  -webkit-user-select: none;
  user-select: none;
}

/* ─── TRACK ─── */
.bv-track {
  display: flex;
  transition: transform 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  will-change: transform;
}

/* ─── SLIDE ─── */
.bv-slide {
  min-width: 100%;
  width: 100%;
  flex-shrink: 0;
  height: 250px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: stretch;
}

/* Decorativo */
.bv-deco {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
}

/* ─── FOTO (direita) ─── */
.bv-photo-wrap {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 52%;
  z-index: 1;
  overflow: hidden;
  /* Fundo claro para fotos de produto com fundo branco/cinza */
  background: linear-gradient(to right, transparent 0%, #eef2f8 30%, #f4f6fb 100%);
}

/* Fade que funde a área da foto com o fundo escuro do slide */
.bv-photo-fade {
  position: absolute;
  inset: 0; z-index: 2;
  pointer-events: none;
}

.bv-photo-img {
  width: 100%; height: 100%;
  object-fit: contain;
  object-position: center center;
  display: block;
}

/* Quando não há foto: placeholder com letra decorativa */
.bv-photo-placeholder {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 16px;
}

.bv-letter-large {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 240px;
  line-height: 1;
  pointer-events: none;
  letter-spacing: -4px;
  opacity: 0.12;
}

/* ─── CONTEÚDO (esquerda) ─── */
.bv-body {
  position: relative;
  z-index: 3;
  width: 56%;
  padding: 16px 16px 30px 28px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 6px;
}

/* Topo: empresa, categoria, marca, modelo */
.bv-top { display: flex; flex-direction: column; gap: 1px; }

.bv-company {
  font-size: 8px; font-weight: 700;
  letter-spacing: 1.8px; text-transform: uppercase;
  color: rgba(255,255,255,0.32); line-height: 1;
}

.bv-cat {
  font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.4px; line-height: 1;
  margin-top: 3px;
}

.bv-brand {
  font-size: 11px; font-weight: 600;
  color: rgba(255,255,255,0.5); line-height: 1.2; margin-top: 2px;
}

.bv-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 44px; line-height: 0.88; color: #fff; letter-spacing: 0.3px;
}

/* Bullets descritivos */
.bv-desc { display: flex; flex-direction: column; gap: 4px; flex: 1; }

.bv-bullet {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; color: rgba(255,255,255,0.7);
  font-weight: 500; line-height: 1.2;
}

.bv-bullet-dot {
  width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0;
}

/* Rodapé: preços + CTA */
.bv-bottom {
  display: flex; align-items: center; gap: 10px;
}

.bv-prices { display: flex; align-items: center; gap: 10px; }

.bv-price-block { display: flex; flex-direction: column; gap: 1px; }

.bv-price-lbl {
  font-size: 8px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.8px; color: rgba(255,255,255,0.32); line-height: 1;
}

.bv-price-row { display: flex; align-items: flex-start; gap: 1px; line-height: 1; }

.bv-price-curr {
  font-size: 11px; font-weight: 800; margin-top: 4px; line-height: 1;
}

.bv-price-big {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px; line-height: 0.9; color: #fff;
}

.bv-price-dec { font-size: 13px; font-weight: 700; margin-top: 3px; line-height: 1; }

.bv-price-sep {
  width: 1px; height: 34px; background: rgba(255,255,255,0.12); flex-shrink: 0; align-self: center;
}

/* CTA */
.bv-cta {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  padding: 10px 16px; border-radius: 10px;
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 800;
  text-decoration: none; cursor: pointer; border: none; color: #1B2B6B;
  letter-spacing: 0.2px;
  transition: transform 0.12s, filter 0.12s;
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  white-space: nowrap; line-height: 1; flex-shrink: 0; margin-left: auto;
}
.bv-cta:active { transform: scale(0.93); filter: brightness(0.88); }
.bv-cta:hover  { filter: brightness(1.08); }

/* ─── SETAS ─── */
.bv-arr {
  position: absolute; top: 50%; transform: translateY(-50%);
  z-index: 30; width: 32px; height: 32px; border-radius: 50%;
  background: rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.14);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: #fff; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.1s;
  padding: 0; line-height: 1; margin-bottom: 8px;
}
.bv-arr:hover  { background: rgba(0,0,0,0.52); }
.bv-arr:active { transform: translateY(-50%) scale(0.86); }
.bv-arr-prev { left: 8px; }
.bv-arr-next { right: 8px; }

/* ─── INDICADORES ─── */
.bv-indicators {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  z-index: 30; display: flex; gap: 5px; align-items: center;
}

.bv-dot-ind {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(255,255,255,0.25);
  transition: all 0.32s ease; cursor: pointer; flex-shrink: 0;
}
.bv-dot-ind.active { width: 20px; border-radius: 3px; }

/* ─── PROGRESS BAR ─── */
.bv-progress {
  position: absolute; bottom: 0; left: 0;
  height: 3px; width: 0%; z-index: 30;
  border-radius: 0 3px 3px 0; transition: width 0.1s linear; opacity: 0.75;
}

/* ─── COUNTER ─── */
.bv-counter {
  position: absolute; top: 10px; right: 48px; z-index: 30;
  font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.28); letter-spacing: 1px;
}

/* ─── LOADING ─── */
.bv-loading {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  height: 250px;
  background: linear-gradient(135deg, #0D1B4B 0%, #1B2B6B 100%);
}
.bv-loading span { font-size: 13px; color: rgba(255,255,255,0.38); }

@keyframes bv-spin { to { transform: rotate(360deg); } }
.bv-loader {
  width: 22px; height: 22px;
  border: 2px solid rgba(255,255,255,0.1); border-top-color: #E8A020;
  border-radius: 50%; animation: bv-spin 0.8s linear infinite; flex-shrink: 0;
}

/* ─── MOBILE ─── */
@media (max-width: 640px) {
  .bv-slide    { height: auto; min-height: 240px; }
  .bv-photo-wrap { width: 46%; opacity: 0.6; }
  .bv-body   { width: 62%; padding: 14px 10px 34px 16px; }
  .bv-name   { font-size: 32px; }
  .bv-brand  { font-size: 10px; }
  .bv-bullet { font-size: 9px; }
  .bv-price-big  { font-size: 26px; }
  .bv-price-curr { font-size: 10px; margin-top: 3px; }
  .bv-price-dec  { font-size: 11px; margin-top: 2px; }
  .bv-cta    { padding: 8px 12px; font-size: 10px; }
  .bv-arr    { display: none; }
  .bv-counter { right: 14px; top: 8px; font-size: 9px; }
  .bv-loading { height: 200px; }
}

@media (max-width: 400px) {
  .bv-photo-wrap { display: none; }
  .bv-body   { width: 100%; padding-right: 16px; }
  .bv-name   { font-size: 30px; }
}
</style>
</head>

<script>
'use strict';

/* ── DURAÇÃO DO SLIDE ── */
const DURATION = 5500;

/* ══════════════════════════════════════════════════════════════════════
   VITRINE — catálogo de veículos exibidos no banner
   ─────────────────────────────────────────────────────────────────────
   tipo         'frota'       → busca preço diário no Supabase

    ],
  },
];

/* ── TEMAS POR SLIDE ── */
const THEMES = [
  { dark: '#0B1640', mid: '#162357', light: '#b8c8e4', accent: '#E8A020' },
  { dark: '#081422', mid: '#0D2240', light: '#b0c0d8', accent: '#4A9EFF' },
  { dark: '#08180A', mid: '#0E2812', light: '#b0ceb4', accent: '#34C759' },
  { dark: '#180808', mid: '#300D0D', light: '#d8b8b8', accent: '#FF6961' },
  { dark: '#14082A', mid: '#260D44', light: '#cebcd8', accent: '#BF5AF2' },
  { dark: '#0C1C28', mid: '#122C3C', light: '#b0ccd8', accent: '#5AC8FA' },
];

/* ── UTILITÁRIOS ── */
function fmtInt(n) {
  return Math.floor(Number(n || 0)).toLocaleString('pt-BR');
}
function fmtDec(n) {
  var cents = Math.round((Number(n || 0) % 1) * 100);
  return ',' + String(cents).padStart(2, '0');
}

function categoryOf(marca, modelo) {
  var s = ((marca || '') + ' ' + (modelo || '')).toLowerCase();
  if (/t-cross|tcross|kicks|creta|compass|tracker|duster|tiguan|taos|hr-v|hrv|ix35|tucson/.test(s)) return 'SUV';
  if (/corolla|civic|sentra|cruze|accord|camry|jetta|cerato/.test(s)) return 'Sedan';
  if (/onix|hb20|polo|fit|gol|march|sandero|kwid|argo|mobi|pulse/.test(s)) return 'Hatch';
  if (/saveiro|s10|hilux|ranger|frontier|l200|toro|amarok/.test(s)) return 'Pickup';
  if (/spin|zafira|lodgy|livina/.test(s)) return 'Minivan';
  return 'Automóvel';
}

/* Verifica se a foto existe (evita img quebrada) */
function imgExists(src, cb) {
  if (!src) { cb(false); return; }
  var i = new Image();
  i.onload  = function() { cb(true); };
  i.onerror = function() { cb(false); };
  i.src = src;
}

/* ── CRIA SLIDE ── */
function mkSlide(v, idx, empresa) {
  var th    = THEMES[idx % THEMES.length];
  var cat   = categoryOf(v.marca, v.modelo);
  var price = parseFloat(v.valor_diaria || 0);
  var monthly = v.valor_mensal ? parseFloat(v.valor_mensal) : Math.round(price * 28);
  var isSob = v.tipo === 'sob_demanda';

  var rawPhone = ((empresa && empresa.telefone) || '').replace(/\D/g, '');
  var wppPhone = rawPhone.length >= 10
    ? (rawPhone.startsWith('55') ? rawPhone : '55' + rawPhone)
    : '5511989990949';
  var wppText = encodeURIComponent(
    'Olá! Gostaria de ' + (isSob ? 'encomendar' : 'alugar') + ' o ' +
    v.marca + ' ' + v.modelo + '. Poderia me passar mais informações?'
  );

  var nomeEmp = (empresa && empresa.nome) || 'Estilo Rent a Car';
  var modeloUp = (v.modelo || '').toUpperCase();
  var bgLetter = (v.marca || '').charAt(0).toUpperCase();
  var ctaLabel = isSob ? 'Encomendar →' : 'Reservar →';

  var bullets = (v.descricao || []).slice(0, 4).map(function(d) {
    return '<div class="bv-bullet">' +
             '<span class="bv-bullet-dot" style="background:' + th.accent + '"></span>' +
             d +
           '</div>';
  }).join('');

  /* Bloco de preços */
  var priceHtml;
  if (isSob) {
    priceHtml =
      '<div class="bv-prices">' +
        '<div class="bv-price-block">' +
          '<div class="bv-price-lbl">Mensal</div>' +
          '<div class="bv-price-row">' +
            '<span class="bv-price-curr" style="color:' + th.accent + '">R$</span>' +
            '<span class="bv-price-big">' + fmtInt(monthly) + '</span>' +
            '<span class="bv-price-dec" style="color:' + th.accent + '">' + fmtDec(monthly) + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
  } else {
    priceHtml =
      '<div class="bv-prices">' +
        '<div class="bv-price-block">' +
          '<div class="bv-price-lbl">Diária</div>' +
          '<div class="bv-price-row">' +
            '<span class="bv-price-curr" style="color:' + th.accent + '">R$</span>' +
            '<span class="bv-price-big" style="font-size:28px">' + fmtInt(price) + '</span>' +
            '<span class="bv-price-dec" style="color:' + th.accent + ';font-size:11px;margin-top:4px">' + fmtDec(price) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="bv-price-sep"></div>' +
        '<div class="bv-price-block">' +
          '<div class="bv-price-lbl">Mensal</div>' +
          '<div class="bv-price-row">' +
            '<span class="bv-price-curr" style="color:' + th.accent + '">R$</span>' +
            '<span class="bv-price-big">' + fmtInt(monthly) + '</span>' +
            '<span class="bv-price-dec" style="color:' + th.accent + '">' + fmtDec(monthly) + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /* Foto: testa se existe, senão usa placeholder */
  var photoId = 'bv-photo-' + idx;
  var slideBg = 'linear-gradient(to right,' + th.dark + ' 0%,' + th.mid + ' 48%,' + th.light + ' 100%)';
  var fadeBg  = 'linear-gradient(to right,' + th.mid + ' 0%,transparent 55%)';

  var html =
    '<div class="bv-slide" style="background:' + slideBg + '">' +
      '<div class="bv-deco" style="background:radial-gradient(ellipse 40% 80% at 18% 50%,rgba(255,255,255,0.025) 0%,transparent 70%)"></div>' +

      /* Foto / placeholder — será ajustado por JS após render */
      '<div class="bv-photo-wrap bv-photo-placeholder" id="' + photoId + '">' +
        '<div class="bv-photo-fade" style="background:' + fadeBg + '"></div>' +
        '<div class="bv-letter-large" style="color:' + th.accent + '">' + bgLetter + '</div>' +
      '</div>' +

      /* Conteúdo */
      '<div class="bv-body">' +
        '<div class="bv-top">' +
          '<div class="bv-company">' + nomeEmp + '</div>' +
          '<div class="bv-cat" style="color:' + th.accent + '">' + cat + '</div>' +
          '<div class="bv-brand">' + v.marca + '</div>' +
          '<div class="bv-name">' + modeloUp + '</div>' +
        '</div>' +
        '<div class="bv-desc">' + bullets + '</div>' +
        '<div class="bv-bottom">' +
          priceHtml +
          '<a class="bv-cta" href="https://wa.me/' + wppPhone + '?text=' + wppText + '"' +
             ' target="_blank" rel="noopener noreferrer" style="background:' + th.accent + '">' +
            ctaLabel +
          '</a>' +
        '</div>' +
      '</div>' +
    '</div>';

  return { html: html, photoId: photoId, foto: v.foto, fadeBg: fadeBg };
}

/* ── LÓGICA DO CARROSSEL ── */
var cur = 0, total = 0;
var autoTimer = null, progTimer = null, progStart = 0;
var isPaused = false;
var wrap, track, dotsWrap, progressBar, counterEl;

function goTo(idx) {
  cur = ((idx % total) + total) % total;
  track.style.transform = 'translateX(-' + (cur * 100) + '%)';

  var th = THEMES[cur % THEMES.length];
  dotsWrap.querySelectorAll('.bv-dot-ind').forEach(function(d, i) {
    d.classList.toggle('active', i === cur);
    d.style.background = i === cur ? th.accent : 'rgba(255,255,255,0.25)';
  });

  counterEl.textContent = (cur + 1) + ' / ' + total;

  clearInterval(progTimer);
  progressBar.style.width = '0%';
  progressBar.style.background = th.accent;
  if (!isPaused) startProgress();
}

function startProgress() {
  progStart = Date.now();
  progTimer = setInterval(function() {
    var p = Math.min(100, (Date.now() - progStart) / DURATION * 100);
    progressBar.style.width = p + '%';
    if (p >= 100) clearInterval(progTimer);
  }, 50);
}

function startAuto() {
  clearInterval(autoTimer);
  autoTimer = setInterval(function() { goTo(cur + 1); }, DURATION);
  if (!isPaused) startProgress();
}

function pause() { isPaused = true; clearInterval(autoTimer); clearInterval(progTimer); progressBar.style.width = '0%'; }
function resume() { isPaused = false; startAuto(); }

/* ── MONTA BANNER ── */
function buildBanner(vehicles, empresa) {
  total = vehicles.length;
  if (total === 0) {
    wrap.innerHTML = '<div class="bv-loading"><span style="color:rgba(255,255,255,0.3)">Nenhum veículo disponível.</span></div>';
    return;
  }

  /* Gera slides */
  var slides = vehicles.map(function(v, i) { return mkSlide(v, i, empresa); });

  var trackEl = document.createElement('div');
  trackEl.className = 'bv-track';
  trackEl.innerHTML = slides.map(function(s) { return s.html; }).join('');
  wrap.appendChild(trackEl);
  track = trackEl;

  /* Injeta fotos após render (verifica se imagem existe) */
  slides.forEach(function(s) {
    if (!s.foto) return;
    imgExists(s.foto, function(ok) {
      if (!ok) return;
      var wrap2 = document.getElementById(s.photoId);
      if (!wrap2) return;
      wrap2.classList.remove('bv-photo-placeholder');
      wrap2.innerHTML =
        '<div class="bv-photo-fade" style="background:' + s.fadeBg + '"></div>' +
        '<img class="bv-photo-img" src="' + s.foto + '" alt="" loading="lazy">';
    });
  });

  /* Setas */
  if (total > 1) {
    var prev = document.createElement('button');
    prev.className = 'bv-arr bv-arr-prev';
    prev.setAttribute('aria-label', 'Anterior');
    prev.textContent = '‹';
    prev.onclick = function() { goTo(cur - 1); startAuto(); };

    var next = document.createElement('button');
    next.className = 'bv-arr bv-arr-next';
    next.setAttribute('aria-label', 'Próximo');
    next.textContent = '›';
    next.onclick = function() { goTo(cur + 1); startAuto(); };

    wrap.appendChild(prev);
    wrap.appendChild(next);
  }

  /* Dots */
  var inds = document.createElement('div');
  inds.className = 'bv-indicators';
  vehicles.forEach(function(_, i) {
    var d = document.createElement('div');
    d.className = 'bv-dot-ind';
    d.onclick = function() { goTo(i); startAuto(); };
    inds.appendChild(d);
  });
  wrap.appendChild(inds);
  dotsWrap = inds;

  /* Progress */
  var pb = document.createElement('div');
  pb.className = 'bv-progress';
  wrap.appendChild(pb);
  progressBar = pb;

  /* Counter */
  var cnt = document.createElement('div');
  cnt.className = 'bv-counter';
  wrap.appendChild(cnt);
  counterEl = cnt;

  goTo(0);
  startAuto();

  /* Hover pause */
  wrap.addEventListener('mouseenter', pause);
  wrap.addEventListener('mouseleave', resume);

  /* Touch swipe */
  var tx = null, ty = null, moved = false;
  wrap.addEventListener('touchstart', function(e) {
    tx = e.touches[0].clientX; ty = e.touches[0].clientY; moved = false; pause();
  }, { passive: true });
  wrap.addEventListener('touchmove', function(e) {
    if (tx === null) return;
    if (Math.abs(e.touches[0].clientX - tx) > Math.abs(e.touches[0].clientY - ty) + 8) {
      moved = true; e.preventDefault();
    }
  }, { passive: false });
  wrap.addEventListener('touchend', function(e) {
    if (tx !== null && moved) {
      var dx = tx - e.changedTouches[0].clientX;
      if (Math.abs(dx) > 38) goTo(dx > 0 ? cur + 1 : cur - 1);
    }
    tx = ty = null; moved = false; resume();
  }, { passive: true });

  /* Teclado */
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft')  { goTo(cur - 1); startAuto(); }
    if (e.key === 'ArrowRight') { goTo(cur + 1); startAuto(); }
  });
}

/* ── MATCH: encontra veículo no Supabase pelo modelo ── */
function matchSb(vitrine, sbList) {
  var a = (vitrine.modelo || '').toLowerCase().replace(/\s+/g, '').replace(/-/g, '');
  return sbList.find(function(v) {
    var b = (v.modelo || '').toLowerCase().replace(/\s+/g, '').replace(/-/g, '');
    return a.includes(b) || b.includes(a);
  });
}

/* ── INICIALIZAÇÃO ── */
async function init() {
  wrap = document.getElementById('bvWrap');

  var sbList  = [];
  var empresa = {};

  try {
    var [vRes, cRes] = await Promise.all([
      fetch(SB_URL + '/rest/v1/veiculos?status=neq.inativo&order=id.asc', { headers: HDR }),
      fetch(SB_URL + '/rest/v1/config?limit=1', { headers: HDR })
    ]);
    sbList  = (vRes && vRes.ok) ? await vRes.json() : [];
    var cfg = (cRes && cRes.ok)  ? await cRes.json() : [];
    empresa = (cfg && cfg[0]) || {};
  } catch (e) {
    console.warn('[banner-veiculos] offline:', e);
  }

  /* Monta lista final: VITRINE como base, preço real do Supabase quando disponível */
  var lista = VITRINE.map(function(v) {
    var sb = matchSb(v, sbList);
    if (sb && sb.valor_diaria) {
      return Object.assign({}, v, { valor_diaria: sb.valor_diaria });
    }
    return v;
  });

  wrap.innerHTML = '';
  buildBanner(lista, empresa);
}

init();
</script>
